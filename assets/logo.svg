<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8a45c"/>
      <stop offset="0.55" stop-color="#cf8440"/>
      <stop offset="1" stop-color="#b06a2b"/>
    </linearGradient>
    <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f3e4cb"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <circle cx="100" cy="100" r="97" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="97" fill="none" stroke="#3a2318" stroke-width="4" opacity="0.14"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#fff7e8" stroke-width="1.5" opacity="0.45"/>

  <!-- cake -->
  <g>
    <!-- plate -->
    <ellipse cx="100" cy="134" rx="38" ry="6" fill="#f7ead4"/>
    <rect x="62" y="132" width="76" height="5" rx="2.5" fill="#e6cda4"/>

    <!-- bottom tier -->
    <rect x="70" y="102" width="60" height="30" rx="6" fill="url(#cake)" stroke="#d9bd8f" stroke-width="1.5"/>
    <!-- top tier -->
    <rect x="80" y="78" width="40" height="26" rx="6" fill="url(#cake)" stroke="#d9bd8f" stroke-width="1.5"/>

    <!-- frosting drips (bottom tier) -->
    <circle cx="72" cy="105" r="4" fill="#fffaf0"/>
    <circle cx="84" cy="109" r="4" fill="#fffaf0"/>
    <circle cx="96" cy="111" r="4" fill="#fffaf0"/>
    <circle cx="108" cy="111" r="4" fill="#fffaf0"/>
    <circle cx="120" cy="109" r="4" fill="#fffaf0"/>
    <circle cx="128" cy="105" r="4" fill="#fffaf0"/>
    <!-- frosting (top tier) -->
    <circle cx="82" cy="81" r="3.4" fill="#fffaf0"/>
    <circle cx="92" cy="79" r="3.4" fill="#fffaf0"/>
    <circle cx="102" cy="79" r="3.4" fill="#fffaf0"/>
    <circle cx="112" cy="81" r="3.4" fill="#fffaf0"/>
    <circle cx="118" cy="83" r="3.4" fill="#fffaf0"/>

    <!-- cherry -->
    <circle cx="100" cy="72" r="7" fill="#c0392b"/>
    <circle cx="97.6" cy="69.8" r="2.4" fill="#e74c3c"/>
    <!-- candle -->
    <rect x="98.4" y="60" width="3.2" height="12" rx="1.6" fill="#f0a500"/>
    <ellipse cx="100" cy="58" rx="3.4" ry="4.6" fill="#ffd166"/>
  </g>

  <!-- wordmark -->
  <text x="100" y="156" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="bold" fill="#3a2318">Bakers</text>
  <text x="100" y="175" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold" letter-spacing="3" fill="#3a2318">GALLERY</text>
  <text x="100" y="189" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="8.5" letter-spacing="2.5" fill="#5a3a28" opacity="0.85">INDAPUR</text>
</svg>
